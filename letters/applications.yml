# Applications list for letter writers, rendered by letters/index.qmd.
#
# One entry per application. Fields:
#   institution  (required) e.g. "Purdue University"
#   position     (required) position title as advertised
#   role         (required) one of: postdoc, tt
#   systems      (required) list of where letters go, any of:
#                  mathjobs    letters uploaded on MathJobs
#                  interfolio  letters uploaded on Interfolio (set letter_url)
#                  ajo         letters uploaded on AcademicJobsOnline
#                  bespoke     the institution's own portal emails the writer
#                  email       letters emailed directly (set letter_url: mailto:...)
#                  later       only contact info collected; letters requested if shortlisted
#                an empty list [] means no letters are requested
#   url          (required) link to the job ad
#   deadline     (optional) YYYY-MM-DD; the date letters should be in by
#                (full-consideration / review-start date when the ad gives one)
#   letter_url   (optional) direct letter-upload link (interfolio / ajo / portal / mailto)
#   notes        (optional) anything a letter writer should know (markdown ok)
#   status       (optional) set to "withdrawn" to hide an entry without deleting it

